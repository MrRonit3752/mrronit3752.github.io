<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Giveaway - 20 Skins & 5 Pins!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-yellow: #facc15;
            --accent-pink: #ec4899;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #facc15, #f43f5e, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(244, 63, 94, 0.3);
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 5px;
        }

        .stats-badge {
            display: inline-block;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: var(--accent-yellow);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 8px;
        }

        /* Carousel Container */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 420px;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .carousel-track {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card {
            position: absolute;
            width: 260px;
            height: 360px;
            left: calc(50% - 130px);
            top: calc(50% - 180px);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: transform 0.6s, opacity 0.6s, border-color 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .card.active {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.25);
        }

        .card-img-box {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card img {
            max-width: 130px;
            max-height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card-info {
            text-align: center;
            width: 100%;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-qty {
            background: rgba(236, 72, 153, 0.2);
            color: #f43f5e;
            border: 1px solid rgba(236, 72, 153, 0.4);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .copy-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Controls */
        .controls-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            z-index: 10;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #db2777, #e11d48);
        }

        /* Footer Rules */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            max-width: 600px;
            line-height: 1.4;
            z-index: 10;
        }

        footer span {
            color: #cbd5e1;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎁 Brawl Stars Giveaway 🎁</h1>
        <p class="subtitle">25 Total Winners • 20 Skins & 5 Pins Up For Grabs!</p>
        <div class="stats-badge">8x Sakura Spike • 12x Mariano Kit • 5x Starr Phew</div>
    </header>

    <div class="carousel-container">
        <div class="carousel-track" id="track"></div>
    </div>

    <div class="controls-panel">
        <button class="btn" onclick="rotateCarousel(-1)">◀ Prev</button>
        <button class="btn btn-primary" onclick="triggerConfetti()">🎉 Hype Confetti</button>
        <button class="btn" onclick="toggleAutoPlay()" id="autoBtn">▶ Auto-Spin: OFF</button>
        <button class="btn" onclick="rotateCarousel(1)">Next ▶</button>
    </div>

    <footer>
        To enter: Subscribe, Like, and comment your favorite reward + your social handle! <span>Good luck!</span>
    </footer>

    <script>
        // Pre-loaded items based on your exact details
        const items = [
            { name: "Sakura Spike", type: "Epic Skin", qty: "8 Available", img: "62693.webp", color: "#a855f7" },
            { name: "Mariano Kit", type: "Epic Skin", qty: "12 Available", img: "62694.webp", color: "#3b82f6" },
            { name: "Starr Phew", type: "Collector Pin", qty: "5 Available", img: "62695.webp", color: "#eab308" }
        ];

        // Duplicate items to build a rich carousel loop of 25 items matching your counts
        let carouselItems = [];
        for(let i=0; i<8; i++) carouselItems.push(items[0]);
        for(let i=0; i<12; i++) carouselItems.push(items[1]);
        for(let i=0; i<5; i++) carouselItems.push(items[2]);

        const track = document.getElementById('track');
        let currentIndex = 0;
        let autoPlayInterval = null;
        let isAutoPlaying = false;

        function buildCarousel() {
            track.innerHTML = '';
            const angleStep = 360 / carouselItems.length;
            const radius = window.innerWidth < 768 ? 220 : 320;

            carouselItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card ${index === currentIndex ? 'active' : ''}`;
                
                const theta = angleStep * index;
                card.style.transform = `rotateY(${theta}deg) translateZ(${radius}px)`;

                card.innerHTML = `
                    <div class="card-img-box" style="border-color: ${item.color};">
                        <img src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="card-info">
                        <div class="card-category" style="color: ${item.color}">${item.type}</div>
                        <div class="card-title">${item.name}</div>
                        <div class="card-qty">${item.qty}</div>
                        <button class="copy-btn" onclick="event.stopPropagation(); copyComment('${item.name}')">💬 Copy for Comment</button>
                    </div>
                `;

                card.onclick = () => {
                    currentIndex = index;
                    updateCarousel();
                };

                track.appendChild(card);
            });
            updateCarousel();
        }

        function updateCarousel() {
            const angleStep = 360 / carouselItems.length;
            const targetRotation = -currentIndex * angleStep;
            track.style.transform = `rotateY(${targetRotation}deg)`;

            const cards = track.querySelectorAll('.card');
            cards.forEach((card, idx) => {
                if (idx === currentIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        function rotateCarousel(direction) {
            currentIndex = (currentIndex + direction + carouselItems.length) % carouselItems.length;
            updateCarousel();
        }

        function toggleAutoPlay() {
            const btn = document.getElementById('autoBtn');
            if (isAutoPlaying) {
                clearInterval(autoPlayInterval);
                isAutoPlaying = false;
                btn.innerText = "▶ Auto-Spin: OFF";
                btn.style.background = "#334155";
            } else {
                autoPlayInterval = setInterval(() => {
                    rotateCarousel(1);
                }, 2000);
                isAutoPlaying = true;
                btn.innerText = "⏸ Auto-Spin: ON";
                btn.style.background = "#059669";
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function copyComment(itemName) {
            const text = `I want to win the ${itemName}! Good luck everyone! 🎮✨`;
            navigator.clipboard.writeText(text).then(() => {
                alert(`Copied to clipboard:\n\n"${text}"`);
            });
        }

        window.onload = buildCarousel;
        window.onresize = buildCarousel;
    </script>
</body>
</html>
